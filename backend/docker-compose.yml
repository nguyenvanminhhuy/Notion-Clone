services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: notion_clone_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notion_clone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notion_clone_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ASP.NET Core API ────────────────────────────────────────────────────────
  api:
    image: notionclone-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notion_clone_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Database — override DB_PASSWORD via .env file or environment
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=notion_clone_db;
        Username=postgres;Password=${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}

      # JWT — MUST be overridden in production via secrets / .env
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      Jwt__Issuer: NotionClone
      Jwt__Audience: NotionCloneUsers
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"

      # CORS — comma-separated origins can be expanded here
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:3000}

      # File storage — mount a volume in production
      FileStorage__BasePath: /app/uploads
    volumes:
      - uploads_data:/app/uploads

  migrate:
    image: notionclone-api:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/efbundle"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  uploads_data:
